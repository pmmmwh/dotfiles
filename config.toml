min_version = "2026.10.22"

[settings]
github.credential_command = 'gh auth token --hostname "$MISE_CREDENTIAL_HOST"'
idiomatic_version_file_enable_tools = ["go", "node", "python"]
lockfile = true
self_update.auto = true

[env]
# mise installs and upgrades Claude Code, so it should not replace itself
DISABLE_AUTOUPDATER = "1"

[tools]
go = "1.27"
node = "26"
python = ["3.12", "3.14"]

"1password-cli" = { version = "latest", os = "macos" }
"7zip" = "latest"
atuin = "latest"
bat = "latest"
bottom = "latest"
claude-code = "latest"
cmake = "latest"
codex = "latest"
delta = "latest"
eza = "latest"
fastfetch = "latest"
fnox = { version = "latest", workflow = "release.yml" }
gh = "latest"
golangci-lint = "latest"
gotestsum = "latest"
hadolint = "latest"
hyperfine = "latest"
jq = "latest"
mkcert = "latest"
oh-my-pi = "latest"
onefetch = "latest"
postgres = { version = "17", os = "macos" }
shellcheck = "latest"
shfmt = "latest"
starship = "latest"
tealdeer = "latest"
terraform = "latest"
tokei = "latest"
uv = "latest"
xh = "latest"
yarn = "latest"
yq = "latest"

"npm:agent-browser" = "latest"
"npm:node-gyp" = "latest"
"npm:sharp" = "latest"
"npm:sql-formatter" = "latest"
"npm:svgo" = "latest"

[dotfiles]
"~" = { source = "home", mode = "symlink-each" }
"~/.atuin/config.toml" = "atuin/config.toml"
"~/.config" = { source = "config", mode = "symlink-each", exclude = ["ghostty", "zed"] }
# Apps that are only installed on macOS
"~/.config/ghostty" = { source = "config/ghostty", mode = "symlink-each", variants = [{ os = "macos" }] }
"~/.config/zed" = { source = "config/zed", mode = "symlink-each", variants = [{ os = "macos" }] }
"~/.zshcustom" = { source = "zshcustom", mode = "symlink-each", exclude = ["plugins", "extras.zsh"] }
"~/.zshcustom/extras.zsh" = { content = "#!/usr/bin/env zsh\n", create_if_missing = true }

# Only .gitconfig - git does not follow symlinked config files since 2.32,
# so .gitattributes and .gitignore are wired through GIT_CONFIG_* instead.
"~/.gitconfig" = "git/.gitconfig"
"~/.gitconfig.dotfiles" = { source = "git/.gitconfig.dotfiles.tera", mode = "template" }
"~/.gitconfig.macos" = { source = "git/.gitconfig.macos", variants = [{ os = "macos" }] }
"~/.gitcredentials.personal" = { source = "git/.gitcredentials.personal.tera", mode = "template", permissions = "0600" }
"~/.gitcredentials.work" = { source = "git/.gitcredentials.work.tera", mode = "template", permissions = "0600" }
"~/.ssh/allowed_signers" = { source = "git/allowed-signers.tera", mode = "template" }

# Coding agent settings. Auth, history and caches stay out.
# Only the keys in the source are managed in ~/.claude/settings.json, so the account-linked ones the CLI writes stay local.
"~/.claude/settings.json/shared" = { source = "agents/claude/settings.json", merge = true }
"~/.claude/CLAUDE.md" = "agents/claude/CLAUDE.md"
"~/.claude/rules" = { source = "agents/claude/rules", mode = "symlink-each" }
"~/.claude.personal/rules" = { source = "agents/claude-personal/rules", mode = "symlink-each" }
"~/.claude.personal/settings.json" = "agents/claude-personal/settings.json"
"~/.omp/agent/config.yml" = "agents/omp/config.yml"
"~/.zshcustom/interactive/agent-profiles.zsh" = { source = "agents/profiles.zsh.tera", mode = "template" }

# Records the environment chosen on the first bootstrap, so later runs do not need to re-specify
[dotfiles."mise-env"]
source = "miserc.local.toml.tera"
mode = "template"
remove_empty = true
variants = [{ default = true, target = "{{ mise_config_dir }}/miserc.local.toml" }]

[vars.git_name]
prompt = "Name on git commits"
required = "Run `mise vars prompt git_name`"

[vars.git_personal_email]
prompt = "Email address for personal git commits"
required = "Run `mise vars prompt git_personal_email`"

[vars.git_personal_signing_key]
prompt = "SSH public key for signing personal git commits"  # filled in by signing-keys task
default = ""

[vars.git_work_email]
prompt = "Email address for work git commits"
required = "Run `mise vars prompt git_work_email`"

[vars.git_work_signing_key]
prompt = "SSH public key for signing work git commits"  # filled in by signing-keys task
default = ""

[bootstrap.user]
login_shell = "/bin/zsh"

[bootstrap.hooks]
# Signing keys must exist before the git credentials that reference them are rendered
pre-dotfiles = 'if [ "$(uname)" = Darwin ]; then mise run signing-keys; fi'

[bootstrap.repos]
"~/.zshcustom/plugins/evalcache" = { url = "https://github.com/mroth/evalcache.git" }
"~/.zshcustom/plugins/fast-syntax-highlighting" = { url = "https://github.com/zdharma-continuum/fast-syntax-highlighting.git" }
"~/.zshcustom/plugins/zsh-autocomplete" = { url = "https://github.com/marlonrichert/zsh-autocomplete.git", ref = "26.08.04" }
"~/.zshcustom/plugins/zsh-completions" = { url = "https://github.com/zsh-users/zsh-completions.git" }
"~/.zshcustom/plugins/zsh-defer" = { url = "https://github.com/romkatv/zsh-defer.git" }

[tasks.macos-settings]
description = "Apply macOS settings that fall outside [bootstrap.macos.defaults]"
run = "{{ mise_config_dir }}/@macos/settings.zsh"

[tasks."agents:skills"]
description = "Install the coding agent skills listed in agents/skills.toml (--dry-run, --prune)"
run = "{{ mise_config_dir }}/agents/skills.zsh"

[tasks."agents:mcp"]
description = "Write the MCP servers in agents/mcp.toml into each coding agent's config (--dry-run)"
run = "{{ mise_config_dir }}/agents/mcp.zsh"

[tasks.signing-keys]
description = "Create Secure Enclave keys for signing git commits and save their public keys as vars"
run = "{{ mise_config_dir }}/@macos/signing-keys.zsh"
