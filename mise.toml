[dotfiles]
"~/.curlrc" = "prefs/.curlrc"
"~/.default-gems" = "prefs/.default-gems"
"~/.default-npm-packages" = "prefs/.default-npm-packages"
"~/.editorconfig" = "prefs/.editorconfig"
# Only .gitconfig is linked - git does not follow symlinked config files since 2.32,
# so .gitattributes and .gitignore are wired through GIT_CONFIG_* instead.
"~/.gitconfig" = "git/.gitconfig"
"~/.hushlogin" = "zsh/.hushlogin"
"~/.mackup" = "mackup/.mackup"
"~/.mackup.cfg" = "mackup/.mackup.cfg"
"~/.prettierrc.json" = "prefs/.prettierrc.json"
"~/.sql-formatter.json" = "prefs/.sql-formatter.json"
"~/.wgetrc" = "prefs/.wgetrc"
"~/.zprofile" = "zsh/.zprofile"
"~/.zshenv" = "zsh/.zshenv"
"~/.zshrc" = "zsh/.zshrc"

# Directories - they will contain code not owned by the repo.
"~/.config" = { source = "config", mode = "symlink-each" }
"~/.zshcustom" = { source = "zsh/.zshcustom", mode = "symlink-each", exclude = ["plugins", "extras.zsh"] }

[bootstrap.repos]
"~/.zshcustom/plugins/evalcache" = { url = "https://github.com/mroth/evalcache.git" }
"~/.zshcustom/plugins/fast-syntax-highlighting" = { url = "https://github.com/zdharma-continuum/fast-syntax-highlighting.git" }
"~/.zshcustom/plugins/zsh-autocomplete" = { url = "https://github.com/marlonrichert/zsh-autocomplete.git" }
"~/.zshcustom/plugins/zsh-completions" = { url = "https://github.com/zsh-users/zsh-completions.git" }

[bootstrap.packages]
# GNU utilities, to replace BSD ones on macOS
"brew:coreutils" = "latest"
"brew:findutils" = "latest"
"brew:gnu-sed" = "latest"
"brew:grep" = "latest"
"brew:make" = "latest"

# The `wget` command
"brew:wget" = "latest"

# Other miscellaneous binaries
"brew:ack" = "latest"
"brew:graphviz" = "latest"
"brew:imagemagick" = "latest"
"brew:less" = "latest"
"brew:mackup" = "latest"
"brew:mas" = "latest"
"brew:mole" = "latest"
"brew:onefetch" = "latest"
"brew:p7zip" = "latest"
"brew:pigz" = "latest"
"brew:pkgconf" = "latest"
"brew:protobuf" = "latest"
"brew:readline" = "latest"
"brew:sqlmap" = "latest"
"brew:tree" = "latest"
"brew:xz" = "latest"
"brew:zlib" = "latest"
"brew:zopfli" = "latest"

# General development tools
"brew:cmake" = "latest"
"brew:eza" = "latest"
"brew:flyway" = "latest"
"brew:git" = "latest"
"brew:git-absorb" = "latest"
"brew:git-delta" = "latest"
"brew:mise" = "latest"
"brew:nginx" = "latest"
"brew:postgresql@17" = "latest"
"brew:shellcheck" = "latest"
"brew:sqlite" = "latest"
"brew:watchman" = "latest"

# Docker related tools
"brew:hadolint" = "latest"

# Golang related tools
"brew:golangci-lint" = "latest"

# Swift related tools
"brew:cocoapods" = "latest"
"brew:swiftformat" = "latest"

# Tools to optimise images
"brew:jpegoptim" = "latest"
"brew:optipng" = "latest"
"brew:pngquant" = "latest"

[bootstrap.hooks.pre-packages]
run = [
    'xcode-select -p >/dev/null 2>&1 || { xcode-select --install; echo "Finish the Xcode CLI tools install, then re-run"; exit 1; }',
    # Homebrew is needed for tapped formulae, casks and App Store apps
    'command -v brew >/dev/null || NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"',
]

[bootstrap.hooks.post-tools]
run = "command -v brew >/dev/null || exit 0; brew bundle install --no-upgrade --file=@macos/Brewfile"

[bootstrap.hooks.post-defaults]
run = "killall Dock Finder SystemUIServer || true"

[bootstrap.macos.defaults."com.apple.ActivityMonitor"]
# Visualize CPU usage in the Activity Monitor Dock icon
IconType = 5
# Show the main window when launching Activity Monitor
OpenMainWindow = true
# Show all processes in Activity Monitor
ShowCategory = 100
# Sort Activity Monitor results by CPU usage
SortColumn = "CPUUsage"
SortDirection = 0

[bootstrap.macos.defaults."com.apple.AppleMultitouchTrackpad"]
# Enable tap to click for this user and for the login screen
Clicking = true
# Enable tap to right-click
TrackpadRightClick = true

[bootstrap.macos.defaults."com.apple.BluetoothAudioAgent"]
# Improve sound quality for Bluetooth headphones/headsets
"Apple Bitpool Min (editable)" = 40

[bootstrap.macos.defaults."com.apple.commerce"]
# Turn on app auto-update
AutoUpdate = true
# Allow the App Store to reboot machine on macOS updates
AutoUpdateRestartRequired = true

[bootstrap.macos.defaults."com.apple.dashboard"]
# Disable Dashboard
"dashboard-enabled-state" = 1

[bootstrap.macos.defaults."com.apple.desktopservices"]
# Avoid creating .DS_Store files on network or USB volumes
DSDontWriteNetworkStores = true
DSDontWriteUSBStores = true

[bootstrap.macos.defaults."com.apple.DiskUtility"]
"advanced-image-options" = true
# Enable the debug menu in Disk Utility
DUDebugMenuEnabled = true

[bootstrap.macos.defaults."com.apple.dock"]
# Automatically hide and show the Dock
autohide = true
# Enable spring loading for all Dock items
"enable-spring-load-actions-on-all-items" = true
# Set the magnified icon size of Dock items to 48 pixels
largesize = 48
# Magnify the dock on hover
magnification = true
# Change minimize/maximize window effect
mineffect = "scale"
# Minimize windows into their application’s icon
"minimize-to-application" = true
# Don’t automatically rearrange Spaces based on most recent use
"mru-spaces" = false
# Move the dock on the left
orientation = "left"
# Show indicator lights for open applications in the Dock
"show-process-indicators" = true
# Don’t show recent applications in Dock
"show-recents" = false
# Set the icon size of Dock items to 32 pixels
tilesize = 32

[bootstrap.macos.defaults."com.apple.driver.AppleBluetoothMultitouch.trackpad"]
Clicking = true
TrackpadRightClick = true

[bootstrap.macos.defaults."com.apple.finder"]
# Finder: show hidden files by default
AppleShowAllFiles = true
# When performing a search, search the current folder by default
FXDefaultSearchScope = "SCcf"
# Use list view in all Finder windows by default
# Four-letter codes for the other view modes: `Icnv`, `Clmv`, `Glyv`
FXPreferredViewStyle = "Nlsv"
# Keep folders on top when sorting by name
_FXSortFoldersFirst = true
# Keep folders on top in Desktop
_FXSortFoldersFirstOnDesktop = true
# Set $HOME as the default location for new Finder windows
# For other paths, use `PfLo` and `file:///full/path/here/`
NewWindowTarget = "PfHm"
OpenWindowForNewRemovableDisk = true
# Hide icons for hard drives, servers, and removable media on the desktop
ShowExternalHardDrivesOnDesktop = false
ShowHardDrivesOnDesktop = false
ShowMountedServersOnDesktop = false
# Finder: show path bar
ShowPathbar = true
ShowRemovableMediaOnDesktop = false
# Finder: show status bar
ShowStatusBar = true

[bootstrap.macos.defaults."com.apple.frameworks.diskimages"]
# Automatically open a new Finder window when a volume is mounted
"auto-open-ro-root" = true
"auto-open-rw-root" = true
# Disable disk image verification
"skip-verify" = true
"skip-verify-locked" = true
"skip-verify-remote" = true

[bootstrap.macos.defaults."com.apple.helpviewer"]
# Set Help Viewer windows to non-floating mode
DevMode = true

[bootstrap.macos.defaults."com.apple.mail"]
# Disable inline attachments (just show the icons)
DisableInlineAttachmentViewing = true

[bootstrap.macos.defaults."com.apple.menuextra.clock"]
# Show Day of the week and 24-hour formatted clock in menu bar
DateFormat = "\"EEE HH:mm:ss\""
ShowDate = true
ShowDayOfWeek = false
ShowSeconds = true

[bootstrap.macos.defaults."com.apple.Preview"]
NSQuitAlwaysKeepsWindows = false

[bootstrap.macos.defaults."com.apple.QuickTimePlayerX"]
# Auto-play videos when opened with QuickTime Player
MGPlayMovieOnOpen = true
# Disable window-saving on quit for QuickTime and Preview
NSQuitAlwaysKeepsWindows = false

[bootstrap.macos.defaults."com.apple.Safari"]
# Prevent Safari from opening ‘safe’ files automatically after downloading
AutoOpenSafeDownloads = false
# Allow hitting the Backspace key to go to the previous page in history
"com.apple.Safari.ContentPageGroupIdentifier.WebKit2BackspaceKeyNavigationEnabled" = true
"com.apple.Safari.ContentPageGroupIdentifier.WebKit2DeveloperExtrasEnabled" = true
"com.apple.Safari.ContentPageGroupIdentifier.WebKit2JavaScriptCanOpenWindowsAutomatically" = false
"com.apple.Safari.ContentPageGroupIdentifier.WebKit2TabsToLinks" = true
# Disable Safari’s thumbnail cache for History and Top Sites
DebugSnapshotsUpdatePolicy = 2
# Make Safari’s search banners default to Contains instead of Starts With
FindOnPageMatchesWordStartsOnly = false
# Enable the Develop menu and the Web Inspector in Safari
IncludeDevelopMenu = true
# Enable Safari’s debug menu
IncludeInternalDebugMenu = true
# Update extensions automatically
InstallExtensionUpdatesAutomatically = true
# Enable “Do Not Track”
SendDoNotTrackHTTPHeader = true
# Hide Safari’s bookmarks bar by default
"ShowFavoritesBar-v2" = false
# Show the full URL in the address bar (note: this still hides the scheme)
ShowFullURLInSmartSearchField = true
# Hide Safari’s sidebar in Top Sites
ShowSidebarInTopSites = false
SuppressSearchSuggestions = true
# Privacy: don’t send search queries to Apple
UniversalSearchEnabled = false
# Warn about fraudulent websites
WarnAboutFraudulentWebsites = true
# Enable continuous spellchecking
WebContinuousSpellCheckingEnabled = true
WebKitDeveloperExtrasEnabledPreferenceKey = true
# Block pop-up windows
WebKitJavaScriptCanOpenWindowsAutomatically = false
# Press Tab to highlight each item on a web page
WebKitTabToLinksPreferenceKey = true

[bootstrap.macos.defaults."com.apple.screencapture"]
# Disable shadow in screenshots
"disable-shadow" = true
# Save screenshots in PNG format (other options: BMP, GIF, JPG, PDF, TIFF)
type = "png"

[bootstrap.macos.defaults."com.apple.screensaver"]
# Require password immediately after sleep or screen saver begins
askForPassword = 1
askForPasswordDelay = 0

[bootstrap.macos.defaults."com.apple.SoftwareUpdate"]
# Enable the automatic update check
AutomaticCheckEnabled = true
# Download newly available updates in background
AutomaticDownload = 1
# Automatically download apps purchased on other Macs
ConfigDataInstall = 1
# Install System data files & security updates
CriticalUpdateInstall = 1
# Check for software updates daily, not just once per week
ScheduleFrequency = 1

[bootstrap.macos.defaults."com.apple.systempreferences"]
# Enable window-saving on quit system-wide
NSQuitAlwaysKeepsWindows = true

[bootstrap.macos.defaults."com.apple.Terminal"]
# Enable Secure Keyboard Entry in Terminal.app
# See: https://security.stackexchange.com/a/47786/8918
SecureKeyboardEntry = true

[bootstrap.macos.defaults."com.apple.TextEdit"]
# Open and save files as UTF-8 in TextEdit
PlainTextEncoding = 4
PlainTextEncodingForWrite = 4
# Use plain text mode for new TextEdit documents
RichText = false

[bootstrap.macos.defaults."com.apple.TimeMachine"]
# Prevent Time Machine from prompting to use new hard drives as backup volume
DoNotOfferNewDisksForBackup = true

[bootstrap.macos.defaults."com.apple.widgets"]
# Set widget style to monochrome
widgetAppearance = 0

[bootstrap.macos.defaults."com.apple.windowmanager"]
# Don't add margin between tiled items
EnableTiledWindowMargins = false

[bootstrap.macos.defaults."com.google.Chrome"]
# Use the system-native print preview dialog
DisablePrintPreview = true
# Expand the print dialog by default
PMPrintingExpandedStateForPrint2 = true

[bootstrap.macos.defaults."NSGlobalDomain"]
# Make window fill screen on double-clicking its title bar
AppleActionOnDoubleClick = "Fill"
# Enable font anti-aliasing rendering when font-sizes are smaller than 4px
AppleAntiAliasingThreshold = 4
# Enable subpixel font rendering on non-Apple LCDs
# Ref: https://github.com/kevinSuttle/macOS-Defaults/issues/17#issuecomment-266633501
AppleFontSmoothing = 1
# Use dark icons by default
AppleIconAppearanceTheme = "RegularDark"
AppleICUForce24HourTime = true
# Use dark mode by default
AppleInterfaceStyle = "Dark"
# Enable full keyboard access for all controls
# (e.g. enable Tab in modal dialogs)
AppleKeyboardUIMode = 2
AppleLocale = "en_SE"
AppleMeasurementUnits = "Centimeters"
AppleMetricUnits = true
# Enable press-and-hold - this is useful for typing "accents"
ApplePressAndHoldEnabled = true
# Finder: show all filename extensions
AppleShowAllExtensions = true
# Show scrollbars depending on the context
# Possible values: `WhenScrolling`, `Automatic` and `Always`
AppleShowScrollBars = "Automatic"
AppleTemperatureUnit = "Celsius"
# Disable Font Smoothing Disabler in macOS Mojave
# Ref: https://ahmadawais.com/fix-macos-mojave-font-rendering-issue/
CGFontRenderingFontSmoothingDisabled = false
"com.apple.mouse.tapBehavior" = 1
# Use 0.5s spring loading delay for directories
"com.apple.springing.delay" = 0.5
# Enable spring loading for directories
"com.apple.springing.enabled" = true
# Trackpad: enable secondary click
# Also written host-scoped by the macos-settings task, which macOS reads for HID keys
"com.apple.trackpad.enableSecondaryClick" = true
# Trackpad: enable force-click
"com.apple.trackpad.forceClick" = true
# Disable automatic capitalization as it’s annoying when typing code
NSAutomaticCapitalizationEnabled = false
# Disable smart dashes as they’re annoying when typing code
NSAutomaticDashSubstitutionEnabled = false
# Disable automatic period substitution as it’s annoying when typing code
NSAutomaticPeriodSubstitutionEnabled = false
# Disable smart quotes as they’re annoying when typing code
NSAutomaticQuoteSubstitutionEnabled = false
# Save to disk (not to iCloud) by default
NSDocumentSaveNewDocumentsToCloud = false
# Use expanded save panel by default
NSNavPanelExpandedStateForSaveMode = true
NSNavPanelExpandedStateForSaveMode2 = true
# Enable spellchecker auto language identification
NSSpellCheckerAutomaticallyIdentifiesLanguages = true
# Set sidebar icon size to medium
NSTableViewDefaultSizeMode = 2
# Display ASCII control characters using caret notation in standard text views
NSTextShowsControlCharacters = true
# Increase the window resize speed for Cocoa applications
# This will make them open quicker
NSWindowResizeTime = 0.001
# Use expanded print panel by default
PMPrintingExpandedStateForPrint = true
PMPrintingExpandedStateForPrint2 = true
# Add a context menu item for showing the Web Inspector in web views
WebKitDeveloperExtras = true

[bootstrap.macos.defaults."org.cups.PrintingPrefs"]
# Automatically quit printer apps once the print jobs complete
"Quit When Finished" = true

[tasks.macos-settings]
description = "Apply macOS settings that fall outside [bootstrap.macos.defaults]"
run = "./@macos/settings.zsh"
