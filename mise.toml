min_version = "2026.10.19"

[settings]
# `mise dot add` writes entries here rather than into the global tools config
write_targets.dotfiles = "mise.toml"

[dotfiles]
"~" = { source = "home", mode = "symlink-each" }
"~/.config" = { source = "config", mode = "symlink-each" }
"~/.gnupg" = { source = "gnupg", mode = "symlink-each" }
"~/.zshcustom" = { source = "zshcustom", mode = "symlink-each", exclude = ["plugins", "extras.zsh"] }

# Copied, as Karabiner-Elements replaces the file when it saves
"~/.config/karabiner/karabiner.json" = { source = "karabiner/karabiner.json", mode = "copy", permissions = "0600" }

# Only .gitconfig - git does not follow symlinked config files since 2.32,
# so .gitattributes and .gitignore are wired through GIT_CONFIG_* instead.
"~/.gitconfig" = "git/.gitconfig"
"~/.gitcredentials.personal" = { source = "git/gitcredentials.personal.tera", mode = "template", permissions = "0600" }
"~/.gitcredentials.work" = { source = "git/gitcredentials.work.tera", mode = "template", permissions = "0600" }

# Load this repository as global config, so every mise command sees the setup
# without `--from` or a working directory inside the clone
[dotfiles."mise-conf-d"]
source = "."
mode = "symlink"
variants = [{ default = true, target = "{{ mise_config_dir }}/conf.d/dotfiles" }]

# A conf.d folder reads only mise.toml and mise.<env>.toml, so the fragments
# are linked as fragments of their own
[dotfiles."mise-conf-d-packages"]
source = "mise/conf.d/packages.toml"
mode = "symlink"
variants = [{ default = true, target = "{{ mise_config_dir }}/conf.d/packages.toml" }]

[dotfiles."mise-conf-d-macos"]
source = "mise/conf.d/macos.toml"
mode = "symlink"
variants = [{ default = true, target = "{{ mise_config_dir }}/conf.d/macos.toml" }]

# Records the environment chosen on the first bootstrap, so later runs need no
# `-E`; renders empty, and is removed, when no environment is selected
[dotfiles."mise-env"]
source = "mise/miserc.local.toml.tera"
mode = "template"
remove_empty = true
variants = [{ default = true, target = "{{ mise_config_dir }}/miserc.local.toml" }]

[vars.git_name]
prompt = "Name on git commits"
required = "Run `mise vars prompt git_name`"

[vars.git_personal_email]
prompt = "Email address for personal git commits"
required = "Run `mise vars prompt git_personal_email`"

[vars.git_work_email]
prompt = "Email address for work git commits"
required = "Run `mise vars prompt git_work_email`"

[bootstrap.user]
login_shell = "/bin/zsh"

[bootstrap.repos]
"~/.zshcustom/plugins/evalcache" = { url = "https://github.com/mroth/evalcache.git" }
"~/.zshcustom/plugins/fast-syntax-highlighting" = { url = "https://github.com/zdharma-continuum/fast-syntax-highlighting.git" }
"~/.zshcustom/plugins/zsh-autocomplete" = { url = "https://github.com/marlonrichert/zsh-autocomplete.git" }
"~/.zshcustom/plugins/zsh-completions" = { url = "https://github.com/zsh-users/zsh-completions.git" }

[bootstrap.hooks.post-dotfiles]
run = "'{{ config_root }}/git/generate-signing-keys.zsh'"

[tasks.macos-settings]
description = "Apply macOS settings that fall outside [bootstrap.macos.defaults]"
run = "./@macos/settings.zsh"
