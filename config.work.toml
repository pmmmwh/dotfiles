[tools]
"aqua:auth0/auth0-cli" = "latest"
flyway = "latest"
gcloud = "latest"

[env]
# Make gcloud use managed Python, if available
CLOUDSDK_PYTHON = { value = "{% if tools.python is defined %}{{ tools.python.path }}/bin/python3{% endif %}", tools = true }

[bootstrap.brew.taps]
"dbt-labs/dbt-cli" = "https://github.com/dbt-labs/homebrew-dbt-cli.git"

[bootstrap.packages]
# Database related tools
"brew:dbt-labs/dbt-cli/dbt" = "latest"
