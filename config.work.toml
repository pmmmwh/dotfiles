[tools]
"aqua:auth0/auth0-cli" = "latest"
flyway = "latest"
gcloud = { version = "latest", components = ["cloud-sql-proxy", "docker-credential-gcr"] }

"npm:vercel" = "latest"

[env]
# gcloud's installer expects Python 3.14, so use the managed install whichever Python a project pins
CLOUDSDK_PYTHON = "{{ env.MISE_DATA_DIR | default(value=xdg_data_home ~ '/mise') }}/installs/python/3.14/bin/python3"

[bootstrap.brew.taps]
"dbt-labs/dbt-cli" = "https://github.com/dbt-labs/homebrew-dbt-cli.git"

[bootstrap.packages]
# Database related tools
"brew:dbt-labs/dbt-cli/dbt" = { os = "macos" }
