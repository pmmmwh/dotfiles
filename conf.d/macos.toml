[bootstrap.hooks.post-defaults]
# ~/Library is hidden by a file flag rather than a preference
description = "Unhide ~/Library"
run = '''
xattr -d com.apple.FinderInfo ~/Library 2>/dev/null || true
chflags nohidden ~/Library
'''

[bootstrap.macos.launchd.agents.keyboard-remap]
# Remaps keys on the built-in keyboard using hidutil, which needs Input Monitoring to remap these keys;
# it runs directly, as a shell cannot be granted it, so the mapping is chosen by the keyboard_layout var
# Spotlight key to F20, and on ISO keyboards the section sign and grave accent keys swapped,
# as Apple's ISO keyboards report them the wrong way round relative to ANSI
program = "/usr/bin/hidutil"
args = [
    "property",
    "--matching",
    '{"Built-In":1,"PrimaryUsagePage":1,"PrimaryUsage":6}',
    "--set",
    '{% if vars.keyboard_layout == "iso" %}{"UserKeyMapping":[{"HIDKeyboardModifierMappingSrc":0xC00000221,"HIDKeyboardModifierMappingDst":0x70000006F},{"HIDKeyboardModifierMappingSrc":0x700000035,"HIDKeyboardModifierMappingDst":0x700000064},{"HIDKeyboardModifierMappingSrc":0x700000064,"HIDKeyboardModifierMappingDst":0x700000035}]}{% else %}{"UserKeyMapping":[{"HIDKeyboardModifierMappingSrc":0xC00000221,"HIDKeyboardModifierMappingDst":0x70000006F}]}{% endif %}',
]
process_type = "Interactive"
run_at_load = true
stdout_path = "~/Library/Logs/mise-keyboard-remap.log"
stderr_path = "~/Library/Logs/mise-keyboard-remap.log"

[bootstrap.macos.launchd.agents.signing-keys]
# Offers the Secure Enclave signing keys to ssh-agent after every login
# They are only offered once loaded from the provider; its PIN prompt takes an empty answer,
# and launchd already gives the agent no input and discards its output
program = "/usr/bin/ssh-add"
args = ["-K", "-S", "/usr/lib/ssh-keychain.dylib"]
environment = { SSH_ASKPASS = "/usr/bin/true", SSH_ASKPASS_REQUIRE = "force" }
run_at_load = true
