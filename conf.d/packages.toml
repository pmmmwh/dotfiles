"brew-cask:slack" = { os = "macos" }
"brew-cask:telegram-desktop" = { os = "macos" }

# Creative and design
"brew-cask:figma" = { os = "macos" }
"brew-cask:font-meslo-lg-nerd-font" = { os = "macos" }
"brew-cask:sf-symbols" = { os = "macos" }

# Development
"brew-cask:gitbutler" = { os = "macos" }
