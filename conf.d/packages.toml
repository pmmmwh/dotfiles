[bootstrap.brew]
homebrew_metadata = true

[bootstrap.brew.taps]
"esolitos/ipa" = "https://github.com/esolitos/homebrew-ipa.git"
"xykong/tap" = "https://github.com/xykong/homebrew-tap.git"

[bootstrap.packages]
