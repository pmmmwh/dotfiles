"brew-cask:xykong/tap/flux-markdown" = { os = "macos" }
"brew-cask:ghostty" = { os = "macos" }
"brew-cask:karabiner-elements" = { os = "macos" }
"brew-cask:linear" = { os = "macos" }
"brew-cask:logi-options+" = { os = "macos" }
"brew-cask:microsoft-auto-update" = { os = "macos" }
"brew-cask:microsoft-excel" = { os = "macos" }
"brew-cask:mimestream" = { os = "macos" }
"brew-cask:mullvad-vpn" = { os = "macos" }
"brew-cask:notion" = { os = "macos" }
"brew-cask:raycast" = { os = "macos" }
