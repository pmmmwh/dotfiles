[bootstrap.brew]
homebrew_metadata = true

[bootstrap.brew.taps]
"esolitos/ipa" = "https://github.com/esolitos/homebrew-ipa.git"
"xykong/tap" = "https://github.com/xykong/homebrew-tap.git"

[bootstrap.packages]
# The `wget` command
"brew:wget" = { os = "macos" }

# Other miscellaneous binaries
"brew:ack" = { os = "macos" }
"brew:ffmpeg" = { os = "macos" }
"brew:graphviz" = { os = "macos" }
"brew:imagemagick" = { os = "macos" }
"brew:less" = { os = "macos" }
"brew:mas" = { os = "macos" }  # needs to be installed before `mas:` entries below
"brew:mole" = { os = "macos" }
"brew:nextdns" = { os = "macos" }
"brew:pigz" = { os = "macos" }
"brew:pkgconf" = { os = "macos" }
"brew:readline" = { os = "macos" }
"brew:esolitos/ipa/sshpass" = { os = "macos" }
"brew:sqlmap" = { os = "macos" }
"brew:tree" = { os = "macos" }
"brew:xz" = { os = "macos" }
"brew:zlib" = { os = "macos" }
"brew:zopfli" = { os = "macos" }

# General development tools
"brew:git" = { os = "macos" }
"brew:watchman" = { os = "macos" }

# Tools to optimise images
"brew:jpegoptim" = { os = "macos" }
"brew:optipng" = { os = "macos" }
