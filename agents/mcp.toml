# MCP servers for the coding agents. Each target gets [base] plus the section of its profile.
# Only the servers named here (and in [removed]) are changed in a target, so servers added by hand stay.
# Values may use ${VAR}, which the agents expand themselves, so no credential belongs in this file.

[base.superlogical]
url = "https://www.superlogical.com/rex/community-mcp"

# ~/.claude
[default.temporal-docs]
url = "https://temporal.mcp.kapa.ai"

[default.tablepro]
command = "/Applications/TablePro.app/Contents/MacOS/tablepro-mcp"

[default.serena]
harnesses = ["claude"]
command = "uvx"
args = ["--from", "git+https://github.com/oraios/serena", "serena", "start-mcp-server", "--context=claude-code", "--project-from-cwd"]

# ~/.claude.personal
[personal]

[targets.claude-default]
harness = "claude"
profile = "default"
file = "~/.claude.json"

[targets.claude-personal]
harness = "claude"
profile = "personal"
file = "~/.claude.personal/.claude.json"

[targets.omp]
harness = "omp"
profile = "default"
file = "~/.omp/agent/mcp.json"

[targets.pi]
harness = "pi"
profile = "default"
file = "~/.pi/agent/mcp.json"
typed = false

# Servers a target should no longer have, such as ones renamed here
[removed]
omp = ["TablePro"]
