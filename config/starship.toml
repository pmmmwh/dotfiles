read_only = " 󰌾"
repo_root_format = "[$repo_root]($style)[$path]($style)[$read_only]($read_only_style) "
repo_root_style = ""
truncation_length = 5
truncation_symbol = "…/"
substitutions = [
  { from = "Desktop", to = "󰇄" },
  { from = "Developer", to = "" },
  { from = "Documents", to = "󰈙" },
  { from = "Downloads", to = "" },
  { from = "Movies", to = "󰎁" },
  { from = "Music", to = "" },
  { from = "Pictures", to = "" },
]

